# ====================================================================
# Render Blueprint Configuration (render.yaml)
# Personal Expense Tracking and Analysis System
# ====================================================================

services:
  - type: web
    name: personal-expense-tracker
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DB
        sync: false

      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: 25102a04009@gmail.com
      - key: SMTP_FROM
        value: 25102a04009@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: AUTH_DB_PATH
        value: /var/data/accounts.sqlite3
